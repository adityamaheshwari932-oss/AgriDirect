services:
  db:
    image: postgres:16-alpine
    container_name: agridirect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agridirect_db}
      POSTGRES_USER: ${POSTGRES_USER:-agridirect_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agridirect_app} -d ${POSTGRES_DB:-agridirect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agridirect_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agridirect_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agridirect_app}:${POSTGRES_PASSWORD:-postgres_secure_password}@db:5432/${POSTGRES_DB:-agridirect_db}
      SECRET_KEY: ${SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENABLE_AUTH_RATE_LIMIT: ${ENABLE_AUTH_RATE_LIMIT:-true}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      UPLOAD_DIR: uploads/verification
      LISTING_IMAGES_DIR: uploads/listings
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agridirect_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agridirect_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - agridirect_network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  agridirect_network:
    driver: bridge
